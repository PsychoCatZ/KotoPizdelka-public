[package]
license = "MIT"
name = "messenger-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
argon2 = "0.5"
tempfile = "3"
base64 = "0.22"
chacha20poly1305 = "0.10"
hex = "0.4"
messenger-core = { path = "../core" }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
axum = "0.8"
messenger-relay = { path = "../relay" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
