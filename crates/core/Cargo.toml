[package]
license = "MIT"
name = "messenger-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
hex = "0.4"
hkdf = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
vodozemac = { version = "=0.11.1", default-features = false }
zeroize = "1"

[dev-dependencies]
axum = "0.8"
messenger-relay = { path = "../relay" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
