[package]
license = "MIT"
name = "messenger-relay"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
argon2 = "0.5"
zeroize = "1"
axum = "0.8"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
