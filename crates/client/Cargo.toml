[package]
license = "MIT"
name = "messenger-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
tempfile = "3"
base64 = "0.22"
chacha20poly1305 = "0.10"
hex = "0.4"
messenger-core = { path = "../core" }
messenger-platform = { path = "../platform" }
messenger-store = { path = "../store" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
zeroize = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }

[dev-dependencies]
axum = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
messenger-relay = { path = "../relay" }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "io-std", "time"] }
