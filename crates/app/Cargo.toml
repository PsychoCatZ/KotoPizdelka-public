[package]
license = "MIT"
name = "messenger-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
messenger-client = { path = "../client" }
messenger-platform = { path = "../platform" }
messenger-store = { path = "../store" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "time", "sync", "net"] }

[dev-dependencies]
axum = "0.8"
messenger-core = { path = "../core" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros"] }
